name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.os_name }} ${{ matrix.arch }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        runs-on: 
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-26
        include:
          - runs-on: ubuntu-24.04
            os_name: Linux
            arch: amd64
          - runs-on: ubuntu-24.04-arm
            os_name: Linux
            arch: arm64
          - runs-on: macos-26-intel
            os_name: macOS
            arch: amd64
          - runs-on: macos-26
            os_name: macOS
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: raspberrypi-utils

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: dgibson/dtc
          # tag: v1.8.1
          ref: 8f48565e5cfedc74d3f7512f1e0188e9d85dc1de
          path: dtc

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt install meson

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson

      - name: Build dtc
        working-directory: dtc
        run: |
          meson setup -D default_library=static build
          meson compile -C build

      - name: Configure
        working-directory: raspberrypi-utils
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          dtc_dir="$GITHUB_WORKSPACE/dtc"
          injected_lists="$GITHUB_WORKSPACE/InjectCMakeLists.txt"
          printf 'include_directories("%s")\nlink_directories("%s")\n' \
            "$dtc_dir/libfdt" "$dtc_dir/build/libfdt" > "$injected_lists"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_WERROR=ON \
            -DCMAKE_PROJECT_dtmerge_INCLUDE="$injected_lists"

      - name: Build
        working-directory: raspberrypi-utils
        run: cmake --build build

      - name: Install (stage)
        working-directory: raspberrypi-utils
        run: DESTDIR="$PWD/install" cmake --install build

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: utils-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: raspberrypi-utils/install/
          if-no-files-found: error
